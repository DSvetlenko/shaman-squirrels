<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Проверка уровней</title></head>
<body>
<pre id="out">Проверка…</pre>
<script src="../vendor/phaser.min.js"></script>
<script type="module">
// Прогоняет каждый уровень без графики:
// 1) с эталонным решением — уровень должен быть пройден;
// 2) без предметов — уровень не должен проходиться сам собой.
import { GameScene } from '../src/scenes/GameScene.js';
import { normalizeLevel } from '../src/levels/loader.js';

const qs = new URLSearchParams(location.search);
const data = await (await fetch(qs.get('src') || '../levels/levels.json', { cache: 'no-store' })).json();
const onlyRaw = qs.get('only');
const only = !onlyRaw || onlyRaw === 'all' ? null : onlyRaw.split(',');
const traceEvery = Number(qs.get('trace') || 0);
const levels = data.levels.map(normalizeLevel).filter((l) => !only || only.includes(l.id));

function runOne(level, solution) {
  return new Promise((resolve) => {
    const game = new Phaser.Game({
      type: Phaser.HEADLESS, width: 400, height: 520, banner: false, audio: { noAudio: true },
      physics: { default: 'matter', matter: { gravity: { y: 1 }, autoUpdate: false } },
      scene: [],
    });
    game.events.once('ready', () => {
      game.scene.add('game', GameScene, true, {
        level, headless: true,
        onEvent: (name) => {
          if (name !== 'ready') return;
          const sc = game.scene.getScene('game');
          const r = sc.runSolution(solution, 60 * 200, traceEvery);
          game.destroy(true);
          resolve(r);
        },
      });
    });
  });
}

// Режим jitter: проверка, что уровень проходится и при неточной расстановке,
// как у живого игрока (сдвиг каждого предмета на несколько пикселей и градусов).
if (qs.get('jitter')) {
  const J = Number(qs.get('jitter')) || 6;
  const rep = [];
  for (const l of levels) {
    const sol = l.solution || [];
    const variants = [];
    for (const dx of [-J, J]) for (const dy of [-J / 2, J / 2]) variants.push(sol.map((p) => ({ ...p, x: p.x + dx, y: p.y + dy })));
    for (let k = 0; k < sol.length; k++) {
      if (sol[k].type === 'crate') continue;
      for (const da of [-3, 3]) variants.push(sol.map((p, i) => (i === k ? { ...p, angle: (p.angle || 0) + da } : p)));
    }
    let ok = 0;
    const fails = [];
    for (const v of variants) {
      const r = await runOne(l, v);
      if (r.win) ok++; else fails.push(r.error ? 'ERR' : `${r.saved}/${r.total}`);
    }
    rep.push({ id: l.id, ok, n: variants.length, fails });
  }
  window.__report = rep;
  document.getElementById('out').textContent = JSON.stringify(rep);
  throw new Error('done');
}

const report = [];
for (const l of levels) {
  const withSol = await runOne(l, l.solution || []);
  const without = qs.get('nosolo') ? { skipped: true } : await runOne(l, []);
  report.push({ id: l.id, name: l.name, goal: l.goal, total: l.squirrels, solution: withSol, empty: without });
}
window.__report = report;
document.getElementById('out').textContent = JSON.stringify(report, null, 2);
</script>
</body>
</html>
