# Публикация игры на GitHub Pages при каждом пуше в main.
name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Проверяет levels.json и пересобирает service-worker.js
      # с новой версией кэша, чтобы телефоны получили обновление.
      - name: Проверка уровней и сборка
        run: |
          node tools/check-levels.mjs
          node tools/build.mjs

      - name: Сборка папки сайта
        run: |
          mkdir -p _site
          cp -r index.html manifest.json service-worker.js css src levels assets vendor _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
